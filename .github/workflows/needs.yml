name: Bird needs snapshot

# Refreshes the data behind /birds/needs/: eBird reports of species not yet
# photographed. Each run re-pulls the last 3 days and merges into the previous
# snapshot (see .github/scripts/needs.py), so the page never calls eBird itself.
#
# Trip pages (/birds/needs/mexico-city/, /birds/needs/merida/) get their own
# snapshot file from this same job. They must: the publish step replaces the whole data branch, so
# a second workflow publishing there would delete the other's file. To drop a
# trip, delete its `trip` line and its page.

on:
  schedule:
    # 5am, 9am, 1pm, 5pm Pacific daylight time (an hour earlier in winter)
    - cron: "0 12,16,20,0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bird-needs
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Previous snapshot
        run: |
          git fetch --depth=1 origin data || true
          git show origin/data:needs.json > prev.json 2>/dev/null || : > prev.json
          echo "previous snapshot: $(wc -c < prev.json) bytes"
      - name: Pull from eBird 🐦
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
        run: python3 .github/scripts/needs.py --prev prev.json --out out/needs.json
      - name: Pull from eBird, trips ✈️
        # One line per trip page: 30 miles (48 km) around a point, last 3 days.
        # A trip that fails must not sink the others or the home snapshot, and
        # must not lose its last good file when the data branch is replaced.
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
        run: |
          trip() {  # slug  lat,lng,km  name  centre  tz
            git show "origin/data:needs-$1.json" > "prev-$1.json" 2>/dev/null || : > "prev-$1.json"
            python3 .github/scripts/needs.py --prev "prev-$1.json" --out "out/needs-$1.json" \
              --geo "$2" --name "$3" --center "$4" --tz "$5" --keep-days 3 --translate \
            || { echo "::warning::$3 pull failed; keeping the previous snapshot"; \
                 [ -s "prev-$1.json" ] && cp "prev-$1.json" "out/needs-$1.json" || true; }
          }
          trip mexico-city 19.4262,-99.1867,48 "Mexico City" "the anthropology museum" America/Mexico_City
          trip merida      20.9671,-89.6237,48 "Mérida"      "the Plaza Grande"        America/Merida
      - name: Publish to the data branch 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: data
          folder: out
          # Only the latest snapshot matters; don't accumulate a commit per run.
          single-commit: true
          commit-message: "bird needs snapshot"
