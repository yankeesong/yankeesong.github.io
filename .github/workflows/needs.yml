name: Bird needs snapshot

# Refreshes the data behind /birds/needs/: eBird reports of species not yet
# photographed. Each run re-pulls the last 3 days and merges into the previous
# snapshot (see .github/scripts/needs.py), so the page never calls eBird itself.
#
# Trip pages (e.g. /birds/needs/mexico-city/) get their own snapshot file from
# this same job. They must: the publish step replaces the whole data branch, so
# a second workflow publishing there would delete the other's file. To drop a
# trip, delete its step and its page.

on:
  schedule:
    # 5am, 9am, 1pm, 5pm Pacific daylight time (an hour earlier in winter)
    - cron: "0 12,16,20,0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bird-needs
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Previous snapshot
        run: |
          git fetch --depth=1 origin data || true
          git show origin/data:needs.json > prev.json 2>/dev/null || : > prev.json
          git show origin/data:needs-mexico-city.json > prev-mexico-city.json 2>/dev/null || : > prev-mexico-city.json
          echo "previous snapshot: $(wc -c < prev.json) bytes; Mexico City: $(wc -c < prev-mexico-city.json) bytes"
      - name: Pull from eBird 🐦
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
        run: python3 .github/scripts/needs.py --prev prev.json --out out/needs.json
      - name: Pull from eBird, Mexico City trip 🇲🇽
        # 30 miles (48 km) around the Museo Nacional de Antropología, last 3 days.
        # A failure here must not sink the home snapshot, and must not delete the
        # trip's last good one when the data branch is replaced.
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
        run: |
          python3 .github/scripts/needs.py --prev prev-mexico-city.json --out out/needs-mexico-city.json \
            --geo 19.4262,-99.1867,48 --name "Mexico City" --center "the anthropology museum" \
            --tz America/Mexico_City --keep-days 3 --translate \
          || { echo "::warning::Mexico City pull failed; keeping the previous snapshot"; \
               [ -s prev-mexico-city.json ] && cp prev-mexico-city.json out/needs-mexico-city.json || true; }
      - name: Publish to the data branch 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: data
          folder: out
          # Only the latest snapshot matters; don't accumulate a commit per run.
          single-commit: true
          commit-message: "bird needs snapshot"
