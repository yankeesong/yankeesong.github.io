# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Install once with:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # Camera originals are what bloated this repo to 1.5GB. Anything this
        # large is almost certainly an unoptimized photo — run
        # bin/optimize-images.sh instead of committing it.
        args: [--maxkb=5120]

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        # Versions must match package.json exactly, otherwise the hook and the
        # Prettier CI workflow will disagree about formatting.
        additional_dependencies:
          - prettier@3.9.6
          - "@shopify/prettier-plugin-liquid@1.11.0"
